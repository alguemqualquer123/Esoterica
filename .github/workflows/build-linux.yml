name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang ninja-build cmake pkg-config \
            libvulkan-dev vulkan-validationlayers vulkan-tools \
            libsdl2-dev libfreetype6-dev uuid-dev \
            libssl-dev libprotobuf-dev protobuf-compiler \
            zlib1g-dev libsqlite3-dev

      - name: Configure (linux-release)
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Verify outputs
        run: |
          ls -lh Build/x64_Release/Linux/ || ls -lh build/linux-release/x64_Release/ || true
          file Build/x64_Release/Linux/EsotericaEditor || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esoterica-Linux-x64_Release
          path: Build/x64_Release/Linux/
          if-no-files-found: warn
