name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download External
        run: |
          if (Test-Path External) { echo "External exists" } else {
            Invoke-WebRequest -Uri "https://github.com/BobbyAnguelov/Esoterica/releases/download/Dependencies/External.zip" -OutFile External.zip
            Expand-Archive External.zip -DestinationPath . -Force
          }
        shell: pwsh

      - name: Build Reflector (generate _AutoGenerated)
        run: |
          msbuild Code/Scripts/Reflect/Esoterica.Scripts.Reflect.vcxproj /p:Configuration=Release /p:Platform=x64
          .\Build\x64_Release\EsotericaReflector.exe -s Esoterica.slnx
        shell: pwsh

      - name: Build Solution Release x64
        run: msbuild Esoterica.slnx /p:Configuration=Release /p:Platform=x64 /m

      - name: Verify outputs
        run: |
          dir Build\x64_Release\*.exe
          dir Build\x64_Release\*.dll
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esoterica-Windows-x64_Release
          path: |
            Build/x64_Release/*.exe
            Build/x64_Release/*.dll
            Build/x64_Release/*.pdb
            Data/**
          if-no-files-found: warn
